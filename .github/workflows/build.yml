name: Build JARVIS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_TARGET_SDK: 35
      ANDROID_BUILD_TOOLS: 35.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK command-line tools
        env:
          ANDROID_SDK_ROOT: ${{ runner.tool_cache }}/android-sdk
        run: |
          echo "Setting up Android SDK..."
          mkdir -p ${{ runner.tool_cache }}/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          cd ${{ runner.tool_cache }}/android-sdk/cmdline-tools
          unzip -q -o /tmp/cmdline-tools.zip
          mkdir -p latest
          cp -r cmdline-tools/* latest/
          echo "ANDROID_HOME=${{ runner.tool_cache }}/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${{ runner.tool_cache }}/android-sdk" >> $GITHUB_ENV

      - name: Accept licenses and install SDK
        run: |
          export ANDROID_HOME=${{ runner.tool_cache }}/android-sdk
          export ANDROID_SDK_ROOT=${ANDROID_HOME}
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1

      - name: Print SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME
          ls -la $ANDROID_HOME/platforms
          ls -la $ANDROID_HOME/build-tools

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          find app/build/outputs/apk -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
